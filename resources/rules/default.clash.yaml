mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true

dns:
  enable: true
  listen: "127.0.0.1:21883"
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    ["*", +.lan, +.local, "time.*.com", "ntp.*.com", +.market.xiaomi.com]
  use-hosts: true
  respect-rules: true
  nameserver-policy:
    {
      "geosite:cn,private":
        [
          "https://120.53.53.53/dns-query",
          "https://223.5.5.5/dns-query",
          "https://223.5.5.5/dns-query#h3=true",
        ],
      "geosite:!cn,!private":
        [
          "https://1.1.1.1/dns-query",
          "https://8.8.8.8/dns-query",
          "https://120.53.53.53/dns-query",
          "https://223.5.5.5/dns-query",
          "https://1.0.0.1/dns-query",
          "https://8.8.4.4/dns-query",
        ],
    }
  proxy-server-nameserver:
    [
      "https://223.5.5.5/dns-query",
      "https://120.53.53.53/dns-query",
      "https://223.5.5.5/dns-query#h3=true",
    ]
  default-nameserver:
    [
      "https://120.53.53.53/dns-query",
      "https://223.5.5.5/dns-query",
      "https://223.6.6.6/dns-query",
    ]
  nameserver:
    [
      "https://1.1.1.1/dns-query",
      "https://8.8.4.4/dns-query",
      "https://120.53.53.53/dns-query",
      "https://223.5.5.5/dns-query",
      "https://8.8.8.8/dns-query",
      "https://1.0.0.1/dns-query",
    ]
  fallback:
    [
      "https://1.1.1.1/dns-query",
      "https://8.8.4.4/dns-query",
      "https://120.53.53.53/dns-query",
      "https://223.5.5.5/dns-query",
      "https://8.8.8.8/dns-query",
      "https://1.0.0.1/dns-query",
    ]
  fallback-filter:
    {
      geoip: true,
      geoip-code: CN,
      ipcidr: [240.0.0.0/4, 127.0.0.0/8],
      domain: [+.google.com, +.facebook.com, +.youtube.com, +.twitter.com],
    }
ntp:
  enable: true
  write-to-system: false
  server: time.windows.com
  port: 123
  interval: 30

proxies:

proxy-groups:
  # 总开关：用“单域锁IP”直接在字面上破除用户的封号焦虑
  - { name: "$app_name", type: select, proxies: ["🚀 智能分流·单域锁IP·AI防封 (首选)", "🛡️ 稳定备用·故障转移", "🌆 晚高峰·智能扩容", "🌆 晚高峰·备用", "⚡ 特殊优化·推荐", "⚡ 特殊优化·备用"] }
 
  # ================= 🚀 核心首选组 (官方 + 反代) =================
  - name: "🚀 智能分流·单域锁IP·AI防封 (首选)"
    type: load-balance
    strategy: consistent-hashing
    proxies: ["FILTER::推荐"]
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    lazy: true
 
  - name: "🛡️ 稳定备用·故障转移"
    type: fallback
    proxies: ["FILTER::推荐"]
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    lazy: true
 
  # ================= 🌆 晚高峰系列 (精准筛选) =================
  - name: "🌆 晚高峰·智能扩容"
    type: load-balance
    strategy: consistent-hashing
    proxies: ["FILTER::晚高峰"]
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    lazy: true
 
  - name: "🌆 晚高峰·备用"
    type: fallback
    proxies: ["FILTER::晚高峰"]
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    lazy: true
 
  # ================= ⚡ 特殊优化系列 (纯反代) =================
  - name: "⚡ 特殊优化·推荐"
    type: load-balance
    strategy: consistent-hashing
    proxies: ["FILTER::特殊"]
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    lazy: true
 
  - name: "⚡ 特殊优化·备用"
    type: fallback
    proxies: ["FILTER::特殊"]
    url: "http://www.gstatic.com/generate_204"
    interval: 300
    lazy: true



